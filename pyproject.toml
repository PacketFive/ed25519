# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrixos-ed25519"
dynamic = ["version"]
description = "Ed25519 signatures (RFC 8032) in Python, with no compiled code"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Weqaar Janjua", email = "weqaar.janjua@packetfive.com" }]
maintainers = [{ name = "PacketFive" }]
keywords = ["ed25519", "eddsa", "rfc8032", "signature", "pure-python"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PacketFive/ed25519"
Source = "https://github.com/PacketFive/ed25519"
Issues = "https://github.com/PacketFive/ed25519/issues"

[dependency-groups]
# Everything the quality gates need, installed with "pip install --group dev"
# (pip 25.1 or later).
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.dynamic]
version = { attr = "pyrixos_ed25519.__version__" }

# The repository's src directory is the pyrixos_ed25519 package itself.
[tool.setuptools]
packages = ["pyrixos_ed25519"]
package-dir = { pyrixos_ed25519 = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
pyrixos_ed25519 = ["py.typed"]

# Quality gates, run with 'pybootstrap check'.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 90
coverage-package = "pyrixos_ed25519"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.ruff.lint.isort]
known-first-party = ["pyrixos_ed25519"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
